name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Usar a mesma assinatura de teste em todas as compilações
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
          else
            # Fallback se o segredo não existir (gera uma temporária para não quebrar o build)
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
          fi
          echo "Tamanho do arquivo de keystore:"
          ls -la ~/.android/debug.keystore

      - name: Instalar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências do projeto
        run: npm install --legacy-peer-deps

      - name: Gerar a versão web do app
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}

      - name: Configurar Capacitor e Plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Adicionar permissões avançadas ao AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Injeta permissões antes da tag <application>
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"

      - name: Organizar ícone e gerar assets
        run: |
          mkdir -p assets
          if [ -f public/pwa-512x512.png ]; then
            cp public/pwa-512x512.png assets/icon.png
          elif [ -f icon.png ]; then
            cp icon.png assets/icon.png
          fi
          
          # Tenta gerar com a ferramenta oficial
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000' || true
          
          # Aplica o script customizado de ícones com sharp como fallback/adicional
          npm run apply-icons || true

      - name: Sincronizar final com Android
        run: npx cap sync android

      - name: Corrigir conflitos e configurar build.gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          
          # Auto-incremento de versão
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" "$GRADLE_FILE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" "$GRADLE_FILE"
          
          # Correção de conflito Kotlin
          cat >> "$GRADLE_FILE" << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          # Forçar signingConfig para usar o keystore decodificado
          if ! grep -q "android.signingConfigs.debug.storeFile" "$GRADLE_FILE"; then
            cat >> "$GRADLE_FILE" << 'EOF'

            android.signingConfigs.debug.storeFile = new File(System.getProperty("user.home") + "/.android/debug.keystore")
            android.signingConfigs.debug.storePassword = "android"
            android.signingConfigs.debug.keyAlias = "androiddebugkey"
            android.signingConfigs.debug.keyPassword = "android"
            android.buildTypes.debug.signingConfig = android.signingConfigs.debug
            EOF
          fi

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar Fingerprint da Assinatura
        continue-on-error: true
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APKSIGNER=$(ls $SDK/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ] && [ -f "$APK" ]; then
            echo "=== Fingerprint da assinatura (SHA-256) ==="
            "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melhor-Dia-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
