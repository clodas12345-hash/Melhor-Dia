name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Install Project Dependencies
      run: |
        npm install --legacy-peer-deps

    - name: Build Web Application
      run: |
        npm run build

    - name: Setup Android Project
      run: |
        # Inicializa o capacitor de forma não-interativa
        npx --yes @capacitor/cli init "GKD Mobility" "com.gkdmobility.melhordia" --web-dir dist || true

        # Garante a criação da estrutura completa do Android se o Manifest não existir
        if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
          rm -rf android
          npx --yes @capacitor/cli add android
        fi

        # Injeta permissões no AndroidManifest de forma robusta
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i '/android.permission.INTERNET/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_NETWORK_STATE/d' "$MANIFEST"

          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
        fi

        # Auto-incrementa versionCode
        GRADLE_FILE="android/app/build.gradle"
        if [ -f "$GRADLE_FILE" ]; then
          BUILD_NUM=${{ github.run_number }}
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -eq 0 ]; then
            BUILD_NUM=$(date +%s)
          fi
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" "$GRADLE_FILE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" "$GRADLE_FILE"
          sed -i "s/compileSdk .*/compileSdk 34/g" "$GRADLE_FILE" || true
          sed -i "s/targetSdk .*/targetSdk 34/g" "$GRADLE_FILE" || true
        fi

        # Sincroniza os assets para o Android
        npx --yes @capacitor/cli sync android

    - name: Compilar APK Debug e Release
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --no-daemon

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apks-${{ github.run_number }}
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/apk/release/*.apk
        retention-days: 7
