name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Install Project Dependencies
      run: |
        npm install --legacy-peer-deps

    - name: Build Web Application
      run: |
        npm run build

    - name: Setup Android Project
      run: |
        # Inicializa o capacitor de forma não-interativa
        npx --yes @capacitor/cli init "GKD Mobility" "com.gkdmobility.melhordia" --web-dir dist || true

        # Garante a estrutura completa do Android se o Manifest não existir
        if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
          rm -rf android
          npx --yes @capacitor/cli add android
        fi

        # Injeta TODAS as permissões solicitadas no AndroidManifest de forma robusta
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          # Remove duplicatas comuns se já existirem
          sed -i '/android.permission.INTERNET/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_NETWORK_STATE/d' "$MANIFEST"
          sed -i '/android.permission.POST_NOTIFICATIONS/d' "$MANIFEST"
          sed -i '/android.permission.VIBRATE/d' "$MANIFEST"
          sed -i '/android.permission.SCHEDULE_EXACT_ALARM/d' "$MANIFEST"
          sed -i '/android.permission.CAMERA/d' "$MANIFEST"
          sed -i '/android.permission.READ_MEDIA_IMAGES/d' "$MANIFEST"
          sed -i '/android.permission.READ_MEDIA_VIDEO/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_FINE_LOCATION/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_COARSE_LOCATION/d' "$MANIFEST"
          sed -i '/android.permission.ACCESS_BACKGROUND_LOCATION/d' "$MANIFEST"
          sed -i '/android.permission.RECORD_AUDIO/d' "$MANIFEST"
          sed -i '/android.permission.READ_MEDIA_AUDIO/d' "$MANIFEST"
          sed -i '/android.permission.READ_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/android.permission.WRITE_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/android.permission.MANAGE_EXTERNAL_STORAGE/d' "$MANIFEST"
          sed -i '/android.permission.BLUETOOTH/d' "$MANIFEST"
          sed -i '/android.permission.BLUETOOTH_CONNECT/d' "$MANIFEST"
          sed -i '/android.permission.BLUETOOTH_SCAN/d' "$MANIFEST"
          sed -i '/android.permission.BLUETOOTH_ADMIN/d' "$MANIFEST"
          sed -i '/android.permission.READ_CONTACTS/d' "$MANIFEST"
          sed -i '/android.permission.WRITE_CONTACTS/d' "$MANIFEST"
          sed -i '/android.permission.GET_ACCOUNTS/d' "$MANIFEST"
          sed -i '/android.permission.READ_CALL_LOG/d' "$MANIFEST"
          sed -i '/android.permission.WRITE_CALL_LOG/d' "$MANIFEST"
          sed -i '/android.permission.CALL_PHONE/d' "$MANIFEST"
          sed -i '/android.permission.READ_PHONE_STATE/d' "$MANIFEST"
          sed -i '/android.permission.ACTIVITY_RECOGNITION/d' "$MANIFEST"
          sed -i '/android.permission.BODY_SENSORS/d' "$MANIFEST"
          sed -i '/android.permission.SYSTEM_ALERT_WINDOW/d' "$MANIFEST"
          sed -i '/android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS/d' "$MANIFEST"
          sed -i '/android.permission.WAKE_LOCK/d' "$MANIFEST"
          sed -i '/android.permission.FOREGROUND_SERVICE/d' "$MANIFEST"

          # Insere todas as permissões antes da tag <application>
          PERMISSIONS_BLOCK='\
    <uses-permission android:name="android.permission.INTERNET" />\n\
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\
    <uses-permission android:name="android.permission.VIBRATE" />\n\
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n\
    <uses-permission android:name="android.permission.CAMERA" />\n\
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n\
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n\
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n\
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n\
    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n\
    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n\
    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n\
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n\
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n\
    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n\
    <uses-permission android:name="android.permission.BLUETOOTH" />\n\
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n\
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n\
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n\
    <uses-permission android:name="android.permission.READ_CONTACTS" />\n\
    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n\
    <uses-permission android:name="android.permission.GET_ACCOUNTS" />\n\
    <uses-permission android:name="android.permission.READ_CALL_LOG" />\n\
    <uses-permission android:name="android.permission.WRITE_CALL_LOG" />\n\
    <uses-permission android:name="android.permission.CALL_PHONE" />\n\
    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n\
    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n\
    <uses-permission android:name="android.permission.BODY_SENSORS" />\n\
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n\
    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n\
    <uses-permission android:name="android.permission.WAKE_LOCK" />\n\
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />'

          sed -i "/<application/i \\$PERMISSIONS_BLOCK" "$MANIFEST"
        fi

        # Auto-incrementa versionCode
        GRADLE_FILE="android/app/build.gradle"
        if [ -f "$GRADLE_FILE" ]; then
          BUILD_NUM=${{ github.run_number }}
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -eq 0 ]; then
            BUILD_NUM=$(date +%s)
          fi
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" "$GRADLE_FILE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" "$GRADLE_FILE"
          sed -i "s/compileSdk .*/compileSdk 34/g" "$GRADLE_FILE" || true
          sed -i "s/targetSdk .*/targetSdk 34/g" "$GRADLE_FILE" || true
        fi

        # Sincroniza os assets para o Android
        npx --yes @capacitor/cli sync android

    - name: Compilar APK Debug e Release
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --no-daemon

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apks-${{ github.run_number }}
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/apk/release/*.apk
        retention-days: 7
