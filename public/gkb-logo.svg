    <text x="230" y="337" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="28" fill="#556575" letter-spacing="9" text-anchor="middle">MOBILITY</text>
    <line x1="370" y1="330" x2="420" y2="330" stroke="#0088ff" stroke-width="2" />
