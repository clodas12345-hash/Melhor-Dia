<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="#ffffff" />
  
  <g transform="translate(26, 40)">
    <!-- GKB Main Logo Group -->
    <g fill="#0a2540">
      <!-- G -->
      <path d="M 50 150 C 40 150 30 160 30 180 L 30 260 C 30 280 40 290 60 290 L 120 290 C 140 290 150 280 150 260 L 150 220 L 95 220 L 95 245 L 120 245 L 120 262 C 120 266 116 268 110 268 L 65 268 C 60 268 56 264 56 258 L 56 182 C 56 176 60 172 66 172 L 120 172 C 130 172 140 165 145 150 Z" />
      
      <!-- K (Left part of K) -->
      <path d="M 160 150 L 195 150 L 170 290 L 135 290 Z" />
      
      <!-- B -->
      <path d="M 285 150 L 370 150 C 405 150 425 165 425 190 C 425 210 410 220 390 225 C 415 230 425 245 425 268 C 425 285 405 290 370 290 L 285 290 Z M 315 172 L 315 205 L 360 205 C 375 205 385 200 385 188 C 385 177 375 172 360 172 Z M 315 228 L 315 268 L 365 268 C 380 268 390 262 390 248 C 390 234 380 228 365 228 Z" />
    </g>

